<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <clipPath id="circleClip">
      <circle cx="250" cy="250" r="220" />
    </clipPath>

    <!-- Tumbled stone texture noise -->
    <filter id="stoneNoise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="4" seed="11" result="noise" />
      <feColorMatrix type="saturate" values="0" result="mono" />
      <feComponentTransfer result="contrast">
        <feFuncR type="linear" slope="1.8" intercept="-0.4"/>
        <feFuncG type="linear" slope="1.8" intercept="-0.4"/>
        <feFuncB type="linear" slope="1.8" intercept="-0.4"/>
      </feComponentTransfer>
      <feGaussianBlur stdDeviation="1.5" result="blurred"/>
    </filter>

    <!-- Soft tumble polish displacement -->
    <filter id="tumbleSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="turbulence" baseFrequency="0.008" numOctaves="3" seed="53" result="turb" />
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="40" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <!-- Polished pebble shading -->
    <radialGradient id="pebbleLight" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#f5d6b0" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#c48a5a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a100b" stop-opacity="0"/>
    </radialGradient>

    <!-- Sedimentary band gradients -->
    <linearGradient id="bandWarm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a5a33" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#c48a5a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6b4423" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="bandPale" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0b183" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#a06a3b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#7a4a2b" stop-opacity="0.4"/>
    </linearGradient>

    <radialGradient id="centerGlow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#e8c39e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1a100b" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="copperGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0b183" />
      <stop offset="100%" stop-color="#7a4a2b" />
    </linearGradient>
  </defs>

  <!-- Base dark circle: rough rock before tumbling -->
  <circle cx="250" cy="250" r="220" fill="#1a100b" />

  <g clip-path="url(#circleClip)">
    <!-- Stone grain texture -->
    <rect x="0" y="0" width="500" height="500" fill="#2a1a10" filter="url(#stoneNoise)" opacity="0.4"/>

    <!-- Tumbling drum bands — flowing polished strata -->
    <path d="M -50 170 Q 100 120, 250 190 T 550 140"
          fill="none" stroke="url(#bandWarm)" stroke-width="60" filter="url(#tumbleSoft)" opacity="0.6"/>
    <path d="M -30 270 Q 150 220, 300 290 T 580 240"
          fill="none" stroke="url(#bandPale)" stroke-width="45" filter="url(#tumbleSoft)" opacity="0.5"/>
    <path d="M -40 350 Q 80 300, 200 370 T 560 330"
          fill="none" stroke="#a06a3b" stroke-width="35" filter="url(#tumbleSoft)" opacity="0.4"/>
    <path d="M -20 420 Q 120 380, 280 440 T 540 390"
          fill="none" stroke="#6b4423" stroke-width="28" filter="url(#tumbleSoft)" opacity="0.35"/>

    <!-- Polished tumblestones — smooth river pebbles -->
    <ellipse cx="170" cy="210" rx="78" ry="62" fill="#3a2415" filter="url(#tumbleSoft)" opacity="0.95"/>
    <ellipse cx="170" cy="210" rx="78" ry="62" fill="url(#pebbleLight)" opacity="0.7"/>
    <ellipse cx="148" cy="190" rx="26" ry="16" fill="#f5d6b0" opacity="0.5"/>

    <ellipse cx="345" cy="290" rx="60" ry="48" fill="#3a2415" filter="url(#tumbleSoft)" opacity="0.95"/>
    <ellipse cx="345" cy="290" rx="60" ry="48" fill="url(#pebbleLight)" opacity="0.65"/>
    <ellipse cx="328" cy="274" rx="19" ry="12" fill="#f5d6b0" opacity="0.45"/>

    <ellipse cx="225" cy="385" rx="48" ry="38" fill="#3a2415" filter="url(#tumbleSoft)" opacity="0.95"/>
    <ellipse cx="225" cy="385" rx="48" ry="38" fill="url(#pebbleLight)" opacity="0.6"/>
    <ellipse cx="212" cy="373" rx="15" ry="9" fill="#f5d6b0" opacity="0.4"/>

    <!-- Tumblr-blue grit flecks caught in the polish -->
    <circle cx="300" cy="150" r="7" fill="#6e8ebf" opacity="0.5"/>
    <circle cx="120" cy="330" r="5" fill="#6e8ebf" opacity="0.4"/>
    <circle cx="400" cy="200" r="5" fill="#e0b183" opacity="0.5"/>
    <circle cx="260" cy="120" r="4" fill="#e0b183" opacity="0.4"/>

    <!-- Eccentric ripple rills (family motif, kept faint) -->
    <circle cx="130" cy="160" r="240.0" fill="none" stroke="#c48a5a" stroke-width="8.0" opacity="0.3"/>
    <circle cx="130" cy="160" r="213.3" fill="none" stroke="#a06a3b" stroke-width="8.0" opacity="0.25"/>
    <circle cx="130" cy="160" r="186.7" fill="none" stroke="#8a5a33" stroke-width="8.0" opacity="0.2"/>
    <circle cx="130" cy="160" r="160.0" fill="none" stroke="#6b4423" stroke-width="8.0" opacity="0.15"/>

    <circle cx="380" cy="320" r="260.0" fill="none" stroke="#a06a3b" stroke-width="7.1" opacity="0.25"/>
    <circle cx="380" cy="320" r="212.7" fill="none" stroke="#7a4a2b" stroke-width="7.1" opacity="0.2"/>
    <circle cx="380" cy="320" r="165.5" fill="none" stroke="#c48a5a" stroke-width="7.1" opacity="0.15"/>

    <circle cx="250" cy="480" r="180.0" fill="none" stroke="#6b4423" stroke-width="7.7" opacity="0.2"/>
    <circle cx="250" cy="480" r="128.6" fill="none" stroke="#c48a5a" stroke-width="7.7" opacity="0.15"/>
  </g>

  <!-- Center glow highlight -->
  <circle cx="250" cy="250" r="180" fill="url(#centerGlow)"/>

  <!-- Outer ring -->
  <circle cx="250" cy="250" r="220" fill="none" stroke="url(#copperGlow)" stroke-width="12" />
  <circle cx="250" cy="250" r="235" fill="none" stroke="#c48a5a" stroke-width="3" stroke-dasharray="6, 8" />

  <!-- Stylized star -->
  <path d="M 250 35 L 372 418 L 48 190 L 452 190 L 128 418 Z"
        fill="none"
        stroke="#f5d6b0"
        stroke-width="5"
        stroke-linejoin="round"
        opacity="0.6"
        filter="url(#tumbleSoft)"/>

  <!-- Central polished stone -->
  <circle cx="250" cy="250" r="18" fill="#1a100b" stroke="#c48a5a" stroke-width="4" />
  <circle cx="250" cy="250" r="8" fill="#e0b183" opacity="0.8"/>
  <circle cx="250" cy="250" r="3" fill="#fff4e0"/>

  <!-- Star point nodes with inner stone spots -->
  <g>
    <circle cx="250" cy="35" r="12" fill="#1a100b" stroke="#f5d6b0" stroke-width="3" />
    <circle cx="250" cy="35" r="4" fill="#c48a5a" opacity="0.8"/>
  </g>
  <g>
    <circle cx="372" cy="418" r="12" fill="#1a100b" stroke="#f5d6b0" stroke-width="3" />
    <circle cx="372" cy="418" r="4" fill="#a06a3b" opacity="0.8"/>
  </g>
  <g>
    <circle cx="48" cy="190" r="12" fill="#1a100b" stroke="#f5d6b0" stroke-width="3" />
    <circle cx="48" cy="190" r="4" fill="#e0b183" opacity="0.8"/>
  </g>
  <g>
    <circle cx="452" cy="190" r="12" fill="#1a100b" stroke="#f5d6b0" stroke-width="3" />
    <circle cx="452" cy="190" r="4" fill="#8a5a33" opacity="0.8"/>
  </g>
  <g>
    <circle cx="128" cy="418" r="12" fill="#1a100b" stroke="#f5d6b0" stroke-width="3" />
    <circle cx="128" cy="418" r="4" fill="#6e8ebf" opacity="0.8"/>
  </g>
</svg>
